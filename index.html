<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Campus Navigation</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 30px;
    }

    h1 {
      margin-bottom: 25px;
    }

    .btn-group {
      display: flex;
      justify-content: center;
      gap: 15px;
      flex-wrap: wrap;
    }

    button {
      padding: 14px 22px;
      font-size: 18px;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      background: #1e88e5;
      color: white;
      transition: 0.2s;
    }

    button:hover {
      background: #1565c0;
    }
  </style>
</head>
<body>

  <h1>📍 Choose Destination</h1>

  <div class="btn-group">
    <button onclick="openVideo('admin')">Admin Block</button>
    <button onclick="openVideo('food')">Food Court</button>
    <button onclick="openVideo('sports')">Sports Complex</button>
  </div>

  <script>
    // 🔹 Update video paths if needed
    const videos = {
      admin: "videos/admin_block.mp4",
      food: "videos/food_court.mp4",
      sports: "videos/sports_complex.mp4"
    };

    function openVideo(place) {
      const video = videos[place];

      if (!video) {
        alert("Video not available!");
        return;
      }

      window.open(video, "_blank");
    }
  </script>

</body>
</html>
